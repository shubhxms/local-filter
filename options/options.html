<!DOCTYPE html>
<html>
<head>
  <style>
    body { padding: 20px; }
    .topic { margin: 5px 0; }
  </style>
</head>
<body>
  <h2>Topics to Track</h2>
  <div id="topicsList"></div>
  <input type="text" id="newTopic" placeholder="Add new topic">
  <button id="addTopic">Add</button>
  <h2>Jev API Key</h2>
  <input type="password" id="apiKey" placeholder="Paste API key (console.typesafe.ai)">
  <button id="saveKey">Save</button>
  <span id="keyStatus"></span>
  <h2>Filter Strictness</h2>
  <input type="range" id="strictness" min="0" max="1" step="0.05" value="0.5">
  <span id="strictnessLabel">Balanced</span>
  <br>
  <script src="options.js"></script>
</body>
</html>
