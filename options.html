<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/shared.css">
</head>
<body class="settings">
  <main>
    <div class="masthead">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#fff" stroke="#111" stroke-width="3"/>
        <rect x="14" y="21" width="36" height="6" rx="3" fill="#111"/>
        <rect x="14" y="29" width="27" height="6" rx="3" fill="#111"/>
        <rect x="14" y="37" width="32" height="6" rx="3" fill="#111"/>
      </svg>
      <h1>Local Filter</h1>
    </div>
    <div class="rule"></div>
    <p class="subtitle">Censor what you'd rather not read.</p>

    <section>
      <span class="field-label">Censor — global default</span>
      <div class="choices" id="censorMode">
        <label><input type="radio" name="censor" value="blur"><span>Blur</span></label>
        <label><input type="radio" name="censor" value="black"><span>Black</span></label>
        <label><input type="radio" name="censor" value="pixelate"><span>Pixelate</span></label>
        <label><input type="radio" name="censor" value="hide"><span>Hide</span></label>
      </div>
    </section>

    <section>
      <span class="field-label">Strictness</span>
      <div class="slider-row">
        <input type="range" id="strictness" min="0" max="1" step="0.05" value="0.5">
        <span class="slider-value" id="strictnessLabel">Balanced</span>
      </div>
    </section>

    <section>
      <span class="field-label">Topics</span>
      <div id="topicsList"></div>
      <div class="add-row">
        <input type="text" id="newTopic" placeholder="Add a topic">
        <button id="addTopic" class="ghost">Add</button>
      </div>
    </section>

    <section>
      <span class="field-label">Jev API Key</span>
      <div class="add-row">
        <input type="password" id="apiKey" placeholder="console.typesafe.ai">
        <button id="saveKey" class="ghost">Save</button>
      </div>
      <div class="status" id="keyStatus"></div>
    </section>
  </main>
  <script src="/shared-ui.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
