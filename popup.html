<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/shared.css">
</head>
<body class="popup">
  <main>
    <div class="masthead">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#fff" stroke="#111" stroke-width="3"/>
        <rect x="14" y="21" width="36" height="6" rx="3" fill="#111"/>
        <rect x="14" y="29" width="27" height="6" rx="3" fill="#111"/>
        <rect x="14" y="37" width="32" height="6" rx="3" fill="#111"/>
      </svg>
      <h1>Local Filter</h1>
      <a href="#" class="about-link" data-about>About</a>
    </div>
    <div class="rule"></div>
    <p class="subtitle">Censor what you'd rather not read.</p>

    <section>
      <span class="field-label">Censor style — this site</span>
      <div class="choices" id="censorMode">
        <label><input type="radio" name="censor" value="blur"><span>Blur</span></label>
        <label><input type="radio" name="censor" value="black"><span>Black</span></label>
        <label><input type="radio" name="censor" value="pixelate"><span>Pixelate</span></label>
        <label><input type="radio" name="censor" value="redacted"><span>Redacted</span></label>
        <label><input type="radio" name="censor" value="hide"><span>Hide</span></label>
      </div>
      <div style="margin-top: 6px;">
        <button id="setGlobalMode" class="ghost">Set as global</button>
      </div>
    </section>

    <section>
      <span class="field-label">Auto-censor on load — this site</span>
      <div class="choices" id="autoFilter">
        <label><input type="radio" name="auto" value="on"><span>On</span></label>
        <label><input type="radio" name="auto" value="off"><span>Off</span></label>
      </div>
    </section>

    <section>
      <span class="field-label">Strictness</span>
      <div class="slider-row">
        <div class="slider-stack">
          <input type="range" id="strictness" min="0" max="1" step="0.05" value="0.5">
          <div class="slider-marks">
            <span>permissive</span>
            <span>restrictive</span>
          </div>
        </div>
        <span class="slider-value" id="strictnessLabel">Balanced</span>
      </div>
    </section>

    <button id="filterBtn" class="primary">Filter this page</button>
    <div class="status" id="pageStats"></div>
    <section id="matchStats" hidden>
      <span class="field-label">On this page</span>
      <div id="matchRows"></div>
    </section>

    <footer>
      <a href="#" id="openOptions">Open in new tab ↗</a>
      <kbd id="shortcutHint"></kbd>
    </footer>
  </main>
  <script src="/shared-ui.js"></script>
  <script src="/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
